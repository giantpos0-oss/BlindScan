name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Set up the signing key
        env:
          SIGNING: ${{ secrets.BLINDSCAN_SIGNING }}
        run: |
          if [ -n "$SIGNING" ]; then
            pw="${SIGNING%%:*}"
            echo "::add-mask::$pw"
            printf '%s' "${SIGNING#*:}" | base64 -d > "$RUNNER_TEMP/blindscan.p12"
            echo "BLINDSCAN_KEYSTORE=$RUNNER_TEMP/blindscan.p12" >> "$GITHUB_ENV"
            echo "BLINDSCAN_KEY_PASSWORD=$pw" >> "$GITHUB_ENV"
          else
            echo "::warning::No BLINDSCAN_SIGNING secret: release build uses a temporary debug key"
          fi
      - name: Build debug and release APKs
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew --no-daemon --continue assembleDebug assembleRelease 2>&1 | tee build.log
      # Turn compiler errors into annotations, which can be read without opening the logs.
      - name: Report build errors
        if: failure()
        run: |
          grep -E "^e: |error:|What went wrong|Could not|Unresolved|> " build.log | grep -v "^> Task" | head -150 > errors.txt || true
          split -l 12 errors.txt chunk_ || true
          for f in chunk_*; do
            [ -s "$f" ] || continue
            msg=$(sed -e 's/%/%25/g' "$f" | sed -e ':a;N;$!ba;s/\n/%0A/g')
            echo "::error title=Build error ($f)::$msg"
          done
      - name: Report which key signed the release
        run: |
          apk=$(ls app/build/outputs/apk/release/*.apk | head -1)
          signer=$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)apksigner
          cert=$("$signer" verify --print-certs "$apk" | grep -m1 "SHA-256" | sed 's/.*: //')
          echo "::notice title=Release signing certificate::$cert"
      - uses: actions/upload-artifact@v4
        with:
          name: BlindScan-apks
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk
      # Publish the signed APK as a public download (no GitHub sign-in needed):
      # https://github.com/<owner>/<repo>/releases/latest/download/BlindScan.apk
      - name: Publish download
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ver=$(grep -m1 'versionName' app/build.gradle.kts | sed 's/.*"\(.*\)".*/\1/')
          cp "$(ls app/build/outputs/apk/release/*.apk | head -1)" BlindScan.apk
          if gh release view "v$ver" >/dev/null 2>&1; then
            gh release upload "v$ver" BlindScan.apk --clobber
          else
            gh release create "v$ver" BlindScan.apk --title "BlindScan $ver" --notes "Install BlindScan.apk on your Android phone." --latest
          fi
